name: tests

# Two lanes:
#   fast-tests  — model-free, runs on every push/PR, GATES merges (~1 min).
#   full-tests  — installs the full ML stack, runs everything EXCEPT `needs_data`
#                 (private datasets), on a nightly schedule + manual dispatch.
#
# A clean CI runner has NO local D:\ datasets, so tests that need them are marked
# `needs_data` and excluded from BOTH lanes (run locally with `pytest -m needs_data`).
# The fast lane additionally has no InsightFace/DINOv2/YOLO models, so it runs only
# the model-free scoped subset; the full lane installs them (requirements.txt) and
# caches the downloaded weights.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # nightly full model-backed lane
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (skip LFS blobs — not needed for tests)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install light deps (no torch/insightface/mediapipe)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest hdbscan sqlalchemy alembic pillow-heif

      - name: Run fast test suite
        run: |
          # test_unified_clustering_chain_order imports the FULL step registry (pulls ultralytics ->
          # torch, insightface, mediapipe). It needs the heavy stack, so it's excluded from the light
          # CI; it still runs in the normal local suite where those deps are installed.
          pytest -m "not slow and not e2e and not budapest and not face_e2e and not needs_data" \
            tests/architecture \
            tests/scene_cluster \
            tests/pipeline/test_build_scene_distance.py \
            tests/pipeline/test_scoring_strategy.py \
            tests/albumify_vs_vlm/test_scene_distance_insertion.py \
            --ignore=tests/architecture/test_unified_clustering_chain_order.py \
            -q -p no:cacheprovider

  full-tests:
    # Nightly + manual only — the full ML stack is heavy to install and the model
    # tests are slow. NOT a merge gate (fast-tests is). Runs everything a clean
    # runner can: models installed, but no private datasets (`needs_data` excluded).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libs for OpenCV / MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Cache downloaded model weights
        uses: actions/cache@v4
        with:
          # buffalo_l (InsightFace), DINOv2/AVA (torch hub), YOLOv8 (ultralytics),
          # CLIP + any HF downloads. Keyed on requirements so a dep bump refreshes it.
          path: |
            ~/.insightface
            ~/.cache/torch
            ~/.cache/clip
            ~/.cache/huggingface
            ~/.config/Ultralytics
          key: model-weights-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            model-weights-

      - name: Install full ML stack
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install pytest

      - name: Run full suite (models installed; needs_data excluded)
        run: |
          # Everything a clean runner can do: model-backed tests on bundled fixtures.
          # Excludes: needs_data (private datasets), e2e/budapest/face_e2e (need a live
          # Streamlit/API server or Playwright browser).
          pytest -m "not needs_data and not e2e and not budapest and not face_e2e" \
            -q -p no:cacheprovider
