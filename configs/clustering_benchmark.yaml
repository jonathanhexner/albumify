# Face Clustering Benchmark Configuration
# Compares HDBSCAN vs Hybrid HDBSCAN+kNN clustering methods

# Output settings
output:
  results_dir: results/face_clustering_benchmark
  save_face_crops: true
  crop_size: 112  # Standard face recognition size

# HDBSCAN Method (Current default)
hdbscan:
  algorithm: hdbscan
  params:
    min_cluster_size: 2
    min_samples: 2
    cluster_selection_epsilon: 0.3
    metric: cosine

# Hybrid HDBSCAN+kNN Method (Exemplar-based with Tukey fence thresholds)
hybrid_knn:
  algorithm: hybrid_hdbscan_knn
  params:
    # HDBSCAN initial clustering
    min_cluster_size: 3
    min_samples: 2
    cluster_selection_epsilon: 0.35

    # Threshold computation (T = median(exemplar pairwise dists) + iqr_multiplier*IQR)
    knn_k: 3                    # k for d_k neighbor distance (used to select exemplars)
    iqr_multiplier: 2.0         # IQR multiplier for threshold (2.0 more permissive than 1.5)
    threshold_floor: 0.50       # Minimum threshold for any cluster
    threshold_ceiling: 1.50     # Maximum threshold (let IQR multiplier do most of the work)

    # Exemplar selection
    max_exemplars: 10           # Max exemplars per cluster (faces with smallest d3)

    # Merge criteria (clusters merge if enough cross-exemplar pairs are close)
    merge_min_pairs: 3          # Min exemplar pairs within threshold to merge
    merge_min_distinct: 2       # Min distinct exemplars from each cluster involved

    # Attachment criteria (noise points attach if close to enough exemplars)
    attach_min_exemplars: 2     # Min exemplars within threshold to attach

    # Iteration control
    max_iterations: 10          # Max merge+attach iterations

# Hybrid Closest-Face Method (Cross-cluster d3 matching - checks all faces)
hybrid_closest:
  algorithm: hybrid_closest_face
  params:
    # HDBSCAN initial clustering
    min_cluster_size: 3
    min_samples: 2
    cluster_selection_epsilon: 0.35
    
    # Threshold computation (T = median(d3) + iqr_multiplier*IQR for all faces in cluster)
    knn_k: 3                    # k for d_k neighbor distance computation
    iqr_multiplier: 2.5         # IQR multiplier for threshold (more permissive for cross-cluster d3)
    threshold_floor: 0.30       # Minimum threshold for any cluster
    threshold_ceiling: 1.50     # Maximum threshold (let IQR multiplier do most of the work)
    
    # Exemplar selection (for early exit optimization)
    max_exemplars: 10           # Max exemplars per cluster (used for early exit check)
    
    # Merge criteria (clusters merge if faces fit other cluster's d3 threshold)
    merge_min_faces: 2          # Min faces with cross-cluster d3 <= threshold to merge
    early_exit_multiplier: 2.0  # Skip merge check if min_exemplar_dist > this * max(T_A, T_B)
    
    # Attachment criteria
    attach_min_neighbors: 1     # Min neighbors within threshold to attach (not used currently)

# Pipeline settings for face extraction
pipeline:
  steps:
    - discover_images
    - detect_persons
    - insightface_detect_faces
    - filter_faces
    - extract_face_embeddings
  
  # Filter faces configuration (same as main pipeline)
  filter_faces:
    min_confidence: 0.5
    min_bbox_ratio: 0.02
    min_relative_size: 0.3
    min_eye_ratio: 0.01
  
  # Face embedding configuration
  extract_face_embeddings:
    backend: insightface
    model_name: buffalo_l
    device: cpu
