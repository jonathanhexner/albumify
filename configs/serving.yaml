# Albumify serving config (spec-112). Where the pipeline runs is a setting, not a code path.
#
#   runner:    local      -> this machine, one child process per job
#              modal_gpu  -> Modal L4 worker (sim_bench/serving/modal_app.py, curate_job)
#              modal_cpu  -> Modal CPU worker (curate_job_cpu; slow, free tier)
#   pipeline:  name in configs/pipeline.yaml (default | minimal | ...)
#   device:    for the local runner only (Modal runners choose their own)
#   jobs_root: local job store; every job's files land here whichever runner ran it
#
# Env overrides: ALBUMIFY_RUNNER, ALBUMIFY_PIPELINE, ALBUMIFY_DEVICE, ALBUMIFY_JOBS_ROOT.
# The database is DATABASE_URL (spec-117: Neon, every Albumify table); unset -> ~/.sim_bench/control.db
# for the job tables and ~/.sim_bench/sim_bench.db for the rest. L4 runs need it set.

runner: local
pipeline: default
device: cpu
jobs_root: ~/.sim_bench/jobs

# L4 estimate + spend cap (spec-115 R2). A job over either limit is refused before it starts.
# Rate from the 2026-10-11 / 2026-10-23 Slovakia26 runs (~0.6 s/photo + container start and model load).
max_photos_l4: 1000
max_gpu_minutes: 30
l4_fixed_seconds: 150
l4_seconds_per_photo: 0.6
l4_dollars_per_hour: 0.80

# spec-117 R10: Modal tries these GPUs in this order; the run records the one it got. The spend cap above is
# checked at the dearest GPU in the list (Modal list prices, 2026).
gpu: [L4, A10G]
gpu_dollars_per_hour:
  L4: 0.80
  A10G: 1.10
