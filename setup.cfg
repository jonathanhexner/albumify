[metadata]
name = sim-bench
version = 0.1.0
description = Simple, config-driven image similarity benchmarking (UKBench baseline)
license = MIT
author = Your Name

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    numpy>=1.26,<2.0
    scipy>=1.11
    scikit-learn>=1.4
    scikit-image>=0.22  # spec-098: wavelet noise sigma (estimate_sigma)
    PyWavelets>=1.4     # required by skimage.restoration.estimate_sigma
    opencv-contrib-python>=4.8,<4.12  # single opencv variant (superset); see SIGHTING-111
    Pillow>=10.2
    tqdm>=4.66
    PyYAML>=6.0
    pandas>=2.0
    matplotlib>=3.8
    pydantic>=2.0
    pandera>=0.18
    requests>=2.31
    google-auth>=2.28
    google-auth-oauthlib>=1.2

[options.packages.find]
where = .
exclude =
    tests*
    scripts*
    app*
    archive*
    notebooks*

[options.entry_points]
console_scripts =
    sim-bench = sim_bench.cli:main
